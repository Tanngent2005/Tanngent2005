<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Yiyang Tan — ShanghaiTech University</title>
  <desc id="desc">A dark terminal-inspired banner with cyan typography and an abstract time series signal. LLMs, Agents, Time Series.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080f1d"/>
      <stop offset="1" stop-color="#111c30"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#42e8dd"/>
      <stop offset="1" stop-color="#869cff"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#254d66" stop-opacity=".5"/>
      <stop offset="1" stop-color="#254d66" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#81b6d5" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="348" rx="18" fill="url(#bg)" stroke="#2b3c52"/>
