  <text x="48" y="102" fill="#52ded4" font-family="DejaVu Sans Mono,monospace" font-size="15">&gt; hello, world_</text>
  <text x="45" y="169" fill="#f1f6fc" font-family="DejaVu Sans,Arial,sans-serif" font-weight="700" font-size="56" letter-spacing="-2">Yiyang Tan</text>
  <text x="49" y="205" fill="#a2b5cd" font-family="DejaVu Sans,Arial,sans-serif" font-size="17">Computer Science · ShanghaiTech University</text>
